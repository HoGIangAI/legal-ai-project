name: CI/CD for Semantic Chunker

on:
  push:
    branches: [ "main" ]
    paths:
      - 'src/semantic_chunker/**' # Chỉ chạy khi có thay đổi trong thư mục này

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v4
        with:
          context: ./src/semantic_chunker
          file: ./src/semantic_chunker/Dockerfile
          push: true
          tags: your-docker-username/legal-ai-semantic-chunker:latest # Thay đổi username

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Configure Kubernetes context
        run: |
          mkdir -p ~/.kube
          echo "${{ secrets.KUBE_CONFIG_DATA }}" > ~/.kube/config
      
      - name: Deploy to Kubernetes
        run: |
          kubectl apply -f k8s/semantic-chunker-deployment.yaml
          kubectl apply -f k8s/semantic-chunker-service.yaml

  evaluate:
    needs: deploy
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.9'

      - name: Install evaluation dependencies
        run: pip install -r evaluation_requirements.txt

      - name: Wait for services to be ready after deployment
        run: sleep 30

      - name: Run AI Quality Evaluation
        run: python run_evaluation.py
