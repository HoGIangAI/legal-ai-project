# .github/workflows/reusable-deploy-workflow.yaml
# Đây là workflow có thể tái sử dụng cho tất cả các dịch vụ

name: Reusable Deploy Workflow

# Kích hoạt khi được một workflow khác gọi đến
on:
  workflow_call:
    inputs:
      service_name:
        description: 'Tên của dịch vụ (ví dụ: intent-system)'
        required: true
        type: string
      service_path:
        description: 'Đường dẫn tới thư mục của dịch vụ (ví dụ: src/intent_system)'
        required: true
        type: string
    secrets:
      DOCKERHUB_USERNAME:
        required: true
      DOCKERHUB_TOKEN:
        required: true
      KUBE_CONFIG_DATA:
        required: true

jobs:
  build-and-push:
    name: Build and Push Docker Image
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v4
        with:
          context: ${{ inputs.service_path }}
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/legal-ai-${{ inputs.service_name }}:latest

  deploy:
    name: Deploy to Kubernetes
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up kubectl
        uses: azure/setup-kubectl@v3
        with:
          version: 'v1.24.0' 

      - name: Deploy to Kubernetes cluster
        uses: azure/k8s-deploy@v4
        with:
          namespace: 'default'
          manifests: |
            k8s/${{ inputs.service_name }}-deployment.yaml
            k8s/${{ inputs.service_name }}-service.yaml
          kubeconfig: ${{ secrets.KUBE_CONFIG_DATA }}
          action: 'apply'

  evaluate:
    name: Run AI Evaluation
    needs: deploy
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Python 3.9
        uses: actions/setup-python@v4
        with:
          python-version: 3.9

      - name: Install dependencies
        run: pip install -r evaluation_requirements.txt

      - name: Wait for services to be ready
        run: sleep 30

      - name: Run evaluation script
        run: python run_evaluation.py
