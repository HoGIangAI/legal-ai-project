name: CI

on:
  push:
    branches: [ "**" ]
  pull_request:

jobs:
  lint-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/pyproject.toml') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install deps (dev)
        run: |
          python -m pip install --upgrade pip
          pip install -e .[dev]

      - name: Pre-commit (ruff, format, secrets)
        run: pre-commit run --all-files

      - name: Run unit tests (if any)
        run: pytest -q || true

  # (tuỳ chọn) e2e job dùng services: kafka/neo4j
  e2e:
    runs-on: ubuntu-latest
    services:
      kafka:
        image: bitnami/kafka:3
        ports: [ "9092:9092" ]
        env:
          KAFKA_ENABLE_KRAFT: "yes"
          KAFKA_CFG_PROCESS_ROLES: "broker,controller"
          KAFKA_CFG_NODE_ID: "1"
          KAFKA_CFG_CONTROLLER_QUORUM_VOTERS: "1@kafka:9093"
          KAFKA_CFG_LISTENERS: "PLAINTEXT://:9092,CONTROLLER://:9093"
          KAFKA_CFG_ADVERTISED_LISTENERS: "PLAINTEXT://kafka:9092"
          ALLOW_PLAINTEXT_LISTENER: "yes"
      neo4j:
        image: neo4j:5
        env:
          NEO4J_AUTH: ${{ secrets.NEO4J_AUTH }}
        ports: [ "7687:7687" ]

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: |
          python -m pip install --upgrade pip
          pip install -e .[dev]
      - name: E2E smoke
        env:
          KAFKA_BOOTSTRAP_SERVERS: kafka:9092
          TOPIC_GRAPHOPS: legal-ontology-graphops
          NEO4J_URI: bolt://neo4j:7687
          NEO4J_USER: neo4j
          NEO4J_PASSWORD: ${{ secrets.NEO4J_PASSWORD }}
          ONTOLOGY_FILE: ./data/ontology/ontology_thuytinh_dev.jsonl
        run: |
          python -m tools.ontology.emit_graphops_jsonl --input ${ONTOLOGY_FILE} --json
          python -m services.ontology.ontology_consumer --once
          python -m tools.ontology.verify_after_emit --json
