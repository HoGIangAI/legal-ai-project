name: CI/CD for Intent System

on:
  push:
    branches: [ "main" ]

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v4
        with:
          context: ./src/intent_system
          file: ./src/intent_system/Dockerfile
          push: true
          tags: your-docker-username/legal-ai-intent-system:latest # Nhớ thay đổi username

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Configure Kubernetes context
        run: |
          mkdir -p ~/.kube
          echo "${{ secrets.KUBE_CONFIG_DATA }}" > ~/.kube/config
      
      - name: Deploy to Kubernetes
        run: |
          kubectl apply -f k8s/intent-system-deployment.yaml
          kubectl apply -f k8s/intent-system-service.yaml

  # --- JOB MỚI ĐƯỢC THÊM VÀO ---
  evaluate:
    needs: deploy # Chạy sau khi deploy thành công
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.9'

      - name: Install evaluation dependencies
        run: pip install -r evaluation_requirements.txt

      - name: Wait for services to be ready after deployment
        run: sleep 30

      - name: Run AI Quality Evaluation
        run: python run_evaluation.py

