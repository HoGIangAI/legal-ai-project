# Tên của workflow, sẽ hiển thị trên tab Actions của GitHub
name: CI/CD for Intent System

# Cấu hình trigger: Chạy workflow này khi có push lên nhánh `main`
on:
  push:
    branches:
      - main

# Định nghĩa các jobs sẽ chạy trong workflow
jobs:
  # Job 1: Build Docker image và đẩy lên container registry (Docker Hub)
  build-and-push:
    # Chạy job này trên một máy ảo Ubuntu phiên bản mới nhất
    runs-on: ubuntu-latest
    steps:
      # Bước 1: Checkout mã nguồn từ repository về máy ảo
      - name: Checkout code
        uses: actions/checkout@v4

      # Bước 2: Đăng nhập vào Docker Hub
      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          # Sử dụng secrets đã được cấu hình trong repository của bạn
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # Bước 3: Build và đẩy Docker image
      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          # context chỉ định thư mục chứa Dockerfile và mã nguồn cần build
          context: ./src/intent_system
          # Đẩy image lên registry sau khi build thành công
          push: true
          # Gán tag cho image. Bạn cần thay 'your-docker-username' bằng tên user Docker Hub của bạn.
          tags: your-docker-username/legal-ai-intent-system:latest

  # Job 2: Triển khai ứng dụng lên cluster Kubernetes
  deploy:
    # Chạy job này trên một máy ảo Ubuntu phiên bản mới nhất
    runs-on: ubuntu-latest
    # `needs` đảm bảo job này chỉ chạy sau khi job `build-and-push` hoàn thành thành công
    needs: build-and-push
    steps:
      # Bước 1: Checkout mã nguồn (cần thiết để truy cập thư mục k8s/)
      - name: Checkout code
        uses: actions/checkout@v4

      # Bước 2: Cấu hình kubectl để kết nối tới cluster K8s của bạn
      # Bằng cách đọc nội dung file config từ GitHub Secret
      - name: Set up Kubeconfig
        run: |
          mkdir -p $HOME/.kube
          echo "${{ secrets.KUBE_CONFIG_DATA }}" > $HOME/.kube/config
          chmod 600 $HOME/.kube/config
      
      # Bước 3: Áp dụng các file manifest trong thư mục k8s/ lên cluster
      - name: Deploy to Kubernetes
        run: kubectl apply -f k8s/
