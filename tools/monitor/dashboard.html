<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8" />
  <title>Ontology GraphOps Monitor</title>
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <style>
    :root { font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif; }
    body { margin: 24px; background: #0b1020; color: #e8eefc; }
    .grid { display: grid; grid-template-columns: repeat(auto-fit,minmax(280px,1fr)); gap: 16px; }
    .card { background: #121833; border: 1px solid #24325f; border-radius: 14px; padding: 16px; box-shadow: 0 6px 18px rgba(0,0,0,0.25); }
    h1 { margin: 0 0 12px; font-size: 22px; }
    h2 { margin: 0 0 12px; font-size: 18px; color: #a8c1ff; }
    pre { background: #0f1530; padding: 12px; border-radius: 10px; overflow: auto; max-height: 320px; }
    .row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
    button { background: #2a6dfb; color: white; border: 0; padding: 10px 14px; border-radius: 10px; cursor: pointer; }
    button:disabled { opacity: .6; cursor: not-allowed; }
    .ok { color: #87f59a; font-weight: 600; }
    .bad { color: #ff7b7b; font-weight: 600; }
    .stat { font-size: 28px; font-weight: 700; }
    .muted { opacity: .75; }
    a { color: #9ec3ff; }
  </style>
</head>
<body>
  <h1>Ontology GraphOps Monitor</h1>

  <div class="grid">
    <!-- HEALTH -->
    <div class="card" id="card-health">
      <h2>Health</h2>
      <div class="row">
        <div>Overall:&nbsp;<span id="health-ok" class="muted">...</span></div>
        <button id="btn-refresh-health">Refresh</button>
      </div>
      <pre id="health-json">Đang tải...</pre>
    </div>

    <!-- COUNTS -->
    <div class="card" id="card-counts">
      <h2>Counts</h2>
      <div class="row">
        <button id="btn-refresh-counts">Refresh</button>
        <label class="muted"><input type="checkbox" id="auto-refresh" /> Auto (5s)</label>
      </div>
      <div class="grid" style="grid-template-columns: repeat(2,1fr); gap: 12px; margin-top: 8px;">
        <div><div class="muted">LawArticle</div><div id="c-article" class="stat">-</div></div>
        <div><div class="muted">LawConcept</div><div id="c-concept" class="stat">-</div></div>
        <div><div class="muted">LawEntity</div><div id="c-entity" class="stat">-</div></div>
        <div><div class="muted">REFERS_TO</div><div id="c-refers" class="stat">-</div></div>
      </div>
      <pre id="counts-json" style="margin-top: 12px;">Đang tải...</pre>
    </div>

    <!-- AUDIT -->
    <div class="card" id="card-audit">
      <h2>Audit</h2>
      <div class="row">
        <button id="btn-run-audit">Run Audit</button>
        <span id="audit-status" class="muted">Chưa chạy</span>
      </div>
      <pre id="audit-json" style="margin-top: 10px;">(click Run Audit)</pre>
    </div>

    <!-- REPO -->
    <div class="card" id="card-repo">
      <h2>Repo Info</h2>
      <button id="btn-refresh-repo">Refresh</button>
      <pre id="repo-json">Đang tải...</pre>
    </div>
  </div>

  <div class="card" style="margin-top:16px">
    <div class="row">
      <span class="muted">API:</span>
      <a href="/health" target="_blank">/health</a>
      <a href="/counts" target="_blank">/counts</a>
      <a href="/audit" target="_blank">/audit</a>
      <a href="/repo" target="_blank">/repo</a>
      <a href="/docs" target="_blank">/docs</a>
    </div>
  </div>

<script>
const $ = (sel) => document.querySelector(sel);

async function loadHealth() {
  const res = await fetch("/health");
  const data = await res.json();
  $("#health-json").textContent = JSON.stringify(data, null, 2);
  $("#health-ok").textContent = data.ok ? "OK" : "FAIL";
  $("#health-ok").className = data.ok ? "ok" : "bad";
}

async function loadCounts() {
  const res = await fetch("/counts");
  const data = await res.json();
  const c = data.counts || {};
  $("#c-article").textContent = c.LawArticle ?? "-";
  $("#c-concept").textContent = c.LawConcept ?? "-";
  $("#c-entity").textContent = c.LawEntity ?? "-";
  $("#c-refers").textContent = c.REFERS_TO ?? "-";
  $("#counts-json").textContent = JSON.stringify(data, null, 2);
}

async function runAudit() {
  $("#btn-run-audit").disabled = true;
  $("#audit-status").textContent = "Đang chạy...";
  const res = await fetch("/audit", {method:"POST"});
  const data = await res.json();
  $("#audit-json").textContent = JSON.stringify(data.report || data, null, 2);
  const ok = (data.report && data.report.ok) || data.ok;
  $("#audit-status").textContent = ok ? "OK" : "ISSUES FOUND";
  $("#audit-status").className = ok ? "ok" : "bad";
  $("#btn-run-audit").disabled = false;
}

async function loadRepo() {
  const res = await fetch("/repo");
  const data = await res.json();
  $("#repo-json").textContent = JSON.stringify(data, null, 2);
}

$("#btn-refresh-health").addEventListener("click", loadHealth);
$("#btn-refresh-counts").addEventListener("click", loadCounts);
$("#btn-run-audit").addEventListener("click", runAudit);
$("#btn-refresh-repo").addEventListener("click", loadRepo);

let timer = null;
$("#auto-refresh").addEventListener("change", (e) => {
  if (e.target.checked) timer = setInterval(loadCounts, 5000);
  else { clearInterval(timer); timer = null; }
});

loadHealth(); loadCounts(); loadRepo();
</script>
</body>
</html>
