[project]
name = "legal-ai-platform"
version = "0.3.0"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "uvicorn>=0.30",
  "pydantic>=2.9",
  "pydantic-settings>=2.4",
  "confluent-kafka>=2.5",
  "neo4j>=5.23",
  "tenacity>=9.0",
  "prometheus-client>=0.21",
  "python-dotenv>=1.0",
]
[project.optional-dependencies]
dev = ["ruff>=0.6","mypy>=1.11","pytest>=8.3","types-requests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
strict_optional = true

[tool.pytest.ini_options]
addopts = "-q"
extend-exclude = ["services/ontology/_legacy", "scripts/_archive"]
